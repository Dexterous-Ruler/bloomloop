<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 162" width="640" height="162" role="img" aria-labelledby="fig-1f21d8dd30-title fig-1f21d8dd30-desc" font-family="Manrope, Noto Sans Devanagari, Noto Sans, system-ui, sans-serif" id="fig-1f21d8dd30"><title id="fig-1f21d8dd30-title">Towards independence</title><desc id="fig-1f21d8dd30-desc">A timeline from 1919 to 15 August 1947 with 4 events, in order: 1919, Jallianwala Bagh; 1920, Non-cooperation begins; 1930, Salt March; 15 August 1947, Independence.</desc><rect x="0" y="0" width="640" height="162" fill="#FFFFFF"/><text x="320" y="20" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#1F2A24" font-weight="600">Towards independence</text><line x1="24" y1="92" x2="616" y2="92" stroke="#3A4540" stroke-width="2"/><g id="fig-1f21d8dd30-e1" data-part="e1"><line x1="40" y1="92" x2="53.1" y2="78" stroke="#585C63" stroke-width="1"/><circle cx="40" cy="92" r="4.5" fill="#2F6B4F"/><text x="53.1" y="56" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#2F6B4F" font-weight="700">1919</text><text x="53.1" y="69" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#1F2A24">Jallianwala Bagh</text></g><g id="fig-1f21d8dd30-e2" data-part="e2"><line x1="59.57" y1="92" x2="59.57" y2="108" stroke="#585C63" stroke-width="1"/><circle cx="59.57" cy="92" r="4.5" fill="#2F6B4F"/><text x="59.57" y="114" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#2F6B4F" font-weight="700">1920</text><text x="59.57" y="127.13" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#1F2A24">Non-cooperation</text><text x="59.57" y="140.88" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#1F2A24">begins</text></g><g id="fig-1f21d8dd30-e3" data-part="e3"><line x1="255.22" y1="92" x2="255.22" y2="78" stroke="#585C63" stroke-width="1"/><circle cx="255.22" cy="92" r="4.5" fill="#2F6B4F"/><text x="255.22" y="56" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#2F6B4F" font-weight="700">1930</text><text x="255.22" y="69" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#1F2A24">Salt March</text></g><g id="fig-1f21d8dd30-e4" data-part="e4"><line x1="600" y1="92" x2="592.18" y2="108" stroke="#585C63" stroke-width="1"/><circle cx="600" cy="92" r="4.5" fill="#2F6B4F"/><text x="592.18" y="114" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#2F6B4F" font-weight="700">15 August 1947</text><text x="592.18" y="127" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#1F2A24">Independence</text></g></svg>